[package]
name = "typist"
version = "0.1.1"
description = "A minimal, local-first Markdown editor"
authors = ["CStaks"]
edition = "2021"

[lib]
name = "typist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
