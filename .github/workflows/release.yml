name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: typist-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: typist-windows.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: typist-macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust targets
        run: |
          rustup target add x86_64-unknown-linux-gnu
          rustup target add x86_64-pc-windows-msvc
          rustup target add x86_64-apple-darwin

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # webkit2gtk dev package name varies by Ubuntu version (4.0 vs 4.1)
          if apt-cache search '^libwebkit2gtk-4\.1-dev$' | grep -q libwebkit2gtk-4.1-dev; then
            WEBKIT_PKG=libwebkit2gtk-4.1-dev
          else
            WEBKIT_PKG=libwebkit2gtk-4.0-dev
          fi
          sudo apt-get install -y "$WEBKIT_PKG" libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Build Tauri binary
        run: |
          cargo build --release --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml

      - name: Rename binary for asset
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp src-tauri/target/${{ matrix.target }}/release/typist typist-linux
          elif [ "${{ runner.os }}" = "Windows" ]; then
            cp src-tauri/target/${{ matrix.target }}/release/typist.exe typist-windows.exe
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp src-tauri/target/${{ matrix.target }}/release/typist typist-macos
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: releases

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          RELEASE_NOTES="Typist ${TAG}
          
          Download the asset for your platform:
          - typist-linux — Linux (x86_64)
          - typist-windows.exe — Windows (x86_64)
          - typist-macos — macOS (x86_64)"
          
          gh release create "${TAG}" \
            --title "Typist ${TAG}" \
            --notes "${RELEASE_NOTES}" \
            --latest \
            releases/*
